<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="4; url=/Bibek-Dhakal/" />
    <title>Redirecting to Bibek Dhakal</title>
    <style>
        :root {
            --bg-1: #0b1020;
            --bg-2: #111827;
            --panel: rgba(15, 23, 42, 0.78);
            --panel-border: rgba(148, 163, 184, 0.2);
            --text: #e5eefb;
            --muted: #a5b4cf;
            --accent: #7c3aed;
            --accent-2: #22d3ee;
            --success: #34d399;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(124, 58, 237, 0.28), transparent 35%),
                radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.25), transparent 30%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
            color: var(--text);
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .background-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.5;
            pointer-events: none;
            animation: float 12s ease-in-out infinite alternate;
        }

        .orb-one {
            width: 300px;
            height: 300px;
            background: rgba(124, 58, 237, 0.35);
            top: 10%;
            left: 15%;
        }

        .orb-two {
            width: 240px;
            height: 240px;
            background: rgba(34, 211, 238, 0.25);
            right: 12%;
            bottom: 12%;
            animation-delay: 1.5s;
        }

        @keyframes float {
            0%   { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(20px, -20px, 0) scale(1.08); }
        }

        .card {
            position: relative;
            z-index: 1;
            width: min(92vw, 520px);
            padding: 40px 30px 28px;
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid var(--panel-border);
            box-shadow: 0 25px 80px rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(124, 58, 237, 0.14);
            color: #ddd6fe;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border: 1px solid rgba(167, 139, 250, 0.35);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.8);
        }

        h1 {
            margin: 22px 0 12px;
            font-size: clamp(2rem, 3vw, 2.8rem);
            line-height: 1.1;
            letter-spacing: -0.05em;
        }

        .subtitle {
            margin: 0 auto 28px;
            max-width: 36ch;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.7;
        }

        .loader-wrap {
            display: grid;
            gap: 12px;
            margin: 18px auto 0;
            max-width: 320px;
        }

        .loader {
            width: 52px;
            height: 52px;
            margin: 0 auto;
            border: 3px solid rgba(148, 163, 184, 0.2);
            border-top-color: var(--accent-2);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.35);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .progress {
            position: relative;
            height: 10px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(148, 163, 184, 0.12);
            border: 1px solid rgba(148, 163, 184, 0.15);
        }

        .progress-bar {
            position: absolute;
            inset: 0 auto 0 0;
            width: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transform-origin: left center;
            animation: loading 2.3s ease-in-out infinite;
        }

        @keyframes loading {
            0%   { transform: scaleX(0.15); opacity: 0.8; }
            50%  { transform: scaleX(0.7); opacity: 1; }
            100% { transform: scaleX(1); opacity: 0.75; }
        }

        .meta {
            margin-top: 18px;
            color: var(--muted);
            font-size: 0.9rem;
            letter-spacing: 0.04em;
        }

        .meta strong {
            color: var(--text);
            font-weight: 700;
        }

        .skip-link {
            display: inline-block;
            margin-top: 22px;
            color: #c4b5fd;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }

        .skip-link:hover {
            opacity: 0.8;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px 22px;
            }

            .subtitle {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="background-orb orb-one"></div>
    <div class="background-orb orb-two"></div>

    <main class="card" aria-live="polite">
        <div class="badge"><span class="dot"></span> Portfolio</div>
        <h1>Redirecting...</h1>
        <p class="subtitle">Taking you to my personal website where you can explore my work, projects, and profile.</p>

        <div class="loader-wrap">
            <div class="loader" aria-hidden="true"></div>
            <div class="progress" aria-hidden="true">
                <div class="progress-bar"></div>
            </div>
        </div>

        <div class="meta">Preparing your next destination <strong>in a moment</strong></div>
        <a class="skip-link" href="/Bibek-Dhakal/">Skip redirect</a>
    </main>

    <script>
        const targetUrl = "/Bibek-Dhakal/";
        window.setTimeout(() => {
            window.location.replace(targetUrl);
        }, 4000);
    </script>
</body>
</html>
